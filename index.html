<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curvy Tech Résumé</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #0f172a;
      color: #fff;
      overflow-x: hidden;
    }

    /* Curvy Banner */
    header {
      position: relative;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      text-align: center;
      padding: 80px 20px 120px;
      border-bottom-left-radius: 50% 10%;
      border-bottom-right-radius: 50% 10%;
    }
    header h1 {
      font-size: 2.5rem;
      margin: 0;
    }
    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    /* Tabs container */
    .tabs {
      display: flex;
      justify-content: center;
      margin-top: -60px;
      gap: 15px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .tab-btn:hover {
      transform: translateY(-3px);
    }
    .tab-btn::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.5), transparent);
      transition: all 0.5s ease;
    }
    .tab-btn:hover::after {
      left: 100%;
    }
    .tab-btn.active {
      background: rgba(255,255,255,0.25);
    }

    /* Tab content */
    .tab-content {
      display: none;
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 25px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      animation: fadeSlide 0.6s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeSlide {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* Skills bars */
    .skill {
      margin: 15px 0;
    }
    .skill-name {
      margin-bottom: 5px;
    }
    .skill-bar {
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
    }
    .skill-fill {
      height: 100%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      width: 0;
      transition: width 1.5s ease;
    }

    /* Contact buttons */
    .contact-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .contact-buttons a {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
      transition: all 0.3s;
    }
    .contact-buttons a:hover {
      transform: scale(1.1);
      background: rgba(255,255,255,0.3);
    }

    /* Resume Download */
    .download-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: rgba(255,255,255,0.15);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }
    .download-btn:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <header>
    <h1>John Doe</h1>
    <p>Tech Enthusiast • Developer • Designer</p>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="about">About</button>
    <button class="tab-btn" data-tab="skills">Skills</button>
    <button class="tab-btn" data-tab="projects">Projects</button>
    <button class="tab-btn" data-tab="contact">Contact</button>
  </div>

  <!-- Tab Content -->
  <div id="about" class="tab-content active">
    <h2>About Me</h2>
    <p>I am a passionate software engineer with experience in web development and modern UI/UX design.</p>
    <a href="resume.pdf" class="download-btn" download>Download Résumé</a>
  </div>

  <div id="skills" class="tab-content">
    <h2>Skills</h2>
    <div class="skill">
      <div class="skill-name">HTML / CSS</div>
      <div class="skill-bar"><div class="skill-fill" data-width="90%"></div></div>
    </div>
    <div class="skill">
      <div class="skill-name">JavaScript</div>
      <div class="skill-bar"><div class="skill-fill" data-width="85%"></div></div>
    </div>
    <div class="skill">
      <div class="skill-name">React</div>
      <div class="skill-bar"><div class="skill-fill" data-width="80%"></div></div>
    </div>
  </div>

  <div id="projects" class="tab-content">
    <h2>Projects</h2>
    <p>Coming soon with amazing works!</p>
  </div>

  <div id="contact" class="tab-content">
    <h2>Contact Me</h2>
    <div class="contact-buttons">
      <a href="mailto:example@mail.com">📧</a>
      <a href="tel:+911234567890">📞</a>
      <a href="https://linkedin.com/in/yourprofile" target="_blank">🔗</a>
    </div>
  </div>

  <script>
    // Tab switching
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');

        // Animate skills on open
        if (btn.dataset.tab === 'skills') {
          document.querySelectorAll('#skills .skill-fill').forEach(bar => {
            bar.style.width = bar.dataset.width;
          });
        } else {
          document.querySelectorAll('#skills .skill-fill').forEach(bar => {
            bar.style.width = '0';
          });
        }
      });
    });
  </script>
</body>
</html>
